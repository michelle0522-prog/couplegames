<!DOCTYPE html>
<html lang="zh-HK">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>情侶情趣小懲罰</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #31102f 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);

    .btn-gradient {
      background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);

<body class="pb-10">

    <div class="flex items-center gap-2">
      <span class="text-xl">🔥</span>
      <h1 class="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-rose-300 via-pink-400 to-purple-300">
        情侶情趣小懲罰

    </div>

    <!-- 頁籤切換按鈕 -->
    <div class="flex bg-slate-950/80 p-1 rounded-full border border-rose-900/40 text-xs font-medium">
      <button id="nav-draw-btn" onclick="switchPage('draw')" class="px-3 py-1.5 rounded-full transition-all flex items-center gap-1 bg-gradient-to-r from-rose-600 to-purple-600 text-white shadow-md">
        <span>🎲 抽籤首頁</span>

      <div class="space-y-3">
        <!-- 地點篩選 (按鈕) -->
        <div>
          <label class="block text-[11px] text-slate-400 mb-1.5">📍 執行地點 (必填)</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="selectLocation('在家')" id="btn-loc-home" class="py-2.5 px-3 rounded-xl text-xs font-medium border border-slate-700/80 bg-slate-900/60 text-slate-400 hover:border-slate-600 transition-all flex items-center justify-center gap-1">
              <span>🏠 在家</span>
            </button>
            <button type="button" onclick="selectLocation('任何情況')" id="btn-loc-anywhere" class="py-2.5 px-3 rounded-xl text-xs font-medium border border-slate-700/80 bg-slate-900/60 text-slate-400 hover:border-slate-600 transition-all flex items-center justify-center gap-1">
              <span>🌍 任何情況</span>
            </button>
          </div>
        </div>
        
        <!-- 執行者篩選 (按鈕) -->
        <div>
          <label class="block text-[11px] text-slate-400 mb-1.5">👤 任務執行者 (必填)</label>

              <span>♀️ 女</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 中間抽籤按鈕 -->
    <div>
      <button id="draw-btn" onclick="drawTask()" disabled class="w-full py-3.5 rounded-2xl font-bold text-base text-white btn-gradient disabled:opacity-40 disabled:cursor-not-allowed transition-all flex justify-center items-center gap-2 shadow-lg">
        <span>✨ 抽取懲罰任務</span>

    </div>

      </div>
      <div id="result-content" class="text-sm font-semibold text-slate-100 leading-relaxed px-1 bg-slate-950/50 p-4 rounded-xl border border-slate-800">
        <!-- 任務內容 -->
      </div>
      
      <!-- 操作按鈕 -->
      <div class="grid grid-cols-2 gap-3 pt-1">

        </button>

    async function initData() {
      try {
        // 載入任務庫
        const { data: taskData, error: taskError } = await supabaseClient
          .from('tasks')
          .select('*')
          .order('id');

        if (taskError) throw taskError;

        if (!taskData || taskData.length === 0) {
          // 首次使用：寫入預設 42 個任務
          console.log('首次啟動，正在寫入預設任務...');
          const { error: insertError } = await supabaseClient
            .from('tasks')
            .insert(initialTasks);
          if (insertError) throw insertError;
          tasks = [...initialTasks];
        } else {
          tasks = taskData;
        }

        // 載入記錄清單
        const { data: logData, error: logError } = await supabaseClient
          .from('drawn_logs')
          .select('*')
          .order('created_at', { ascending: false });

        if (logError) throw logError;
        drawnLogs = logData || [];

        renderLogs();
        console.log('資料載入完成，任務數：', tasks.length, '紀錄數：', drawnLogs.length);
      } catch (err) {
        console.error('初始化失敗：', err);
        alert('無法連線到資料庫，請檢查網路或稍後再試。\n錯誤：' + (err.message || err));
      }
    }

    // ========== 篩選與抽籤 ==========
    function selectLocation(loc) {
      selectedLocation = loc;
      const btnHome = document.getElementById('btn-loc-home');
      const btnAnywhere = document.getElementById('btn-loc-anywhere');

      if (loc === '在家') {
        btnHome.className = "py-2.5 px-3 rounded-xl text-xs font-semibold border border-rose-500 bg-rose-600/30 text-rose-200 shadow-md shadow-rose-950/50 transition-all flex items-center justify-center gap-1";
        btnAnywhere.className = "py-2.5 px-3 rounded-xl text-xs font-medium border border-slate-700/80 bg-slate-900/60 text-slate-400 hover:border-slate-600 transition-all flex items-center justify-center gap-1";
      } else {
        btnAnywhere.className = "py-2.5 px-3 rounded-xl text-xs font-semibold border border-rose-500 bg-rose-600/30 text-rose-200 shadow-md shadow-rose-950/50 transition-all flex items-center justify-center gap-1";
        btnHome.className = "py-2.5 px-3 rounded-xl text-xs font-medium border border-slate-700/80 bg-slate-900/60 text-slate-400 hover:border-slate-600 transition-all flex items-center justify-center gap-1";
      }
      checkFilters();
    }

    function selectExecutor(exe) {
      selectedExecutor = exe;
      const btnMale = document.getElementById('btn-exe-male');
      const btnFemale = document.getElementById('btn-exe-female');

      if (exe === '男') {
        btnMale.className = "py-2.5 px-3 rounded-xl text-xs font-semibold border border-purple-500 bg-purple-600/30 text-purple-200 shadow-md shadow-purple-950/50 transition-all flex items-center justify-center gap-1";
        btnFemale.className = "py-2.5 px-3 rounded-xl text-xs font-medium border border-slate-700/80 bg-slate-900/60 text-slate-400 hover:border-slate-600 transition-all flex items-center justify-center gap-1";
      } else {
        btnFemale.className = "py-2.5 px-3 rounded-xl text-xs font-semibold border border-pink-500 bg-pink-600/30 text-pink-200 shadow-md shadow-pink-950/50 transition-all flex items-center justify-center gap-1";
        btnMale.className = "py-2.5 px-3 rounded-xl text-xs font-medium border border-slate-700/80 bg-slate-900/60 text-slate-400 hover:border-slate-600 transition-all flex items-center justify-center gap-1";
      }
      checkFilters();
    }

    function checkFilters() {
      const btn = document.getElementById('draw-btn');
      const warn = document.getElementById('filter-warning');

      if (selectedLocation && selectedExecutor) {
        btn.disabled = false;
        warn.innerText = "條件已選擇，可開啟抽籤";
        warn.className = "text-emerald-400 text-[11px]";
      } else {
        btn.disabled = true;
        warn.innerText = "請選擇地點與執行者";
        warn.className = "text-rose-400 text-[11px]";
      }
    }

    function drawTask() {
      if (!selectedLocation || !selectedExecutor) return;

      const drawnTaskIds = drawnLogs.map(l => l.task_id);

      const availableTasks = tasks.filter(t => {
        const locMatch = (t.location === selectedLocation || t.location === "任何情況");
        const genderMatch = (t.gender === "不限" || t.gender === selectedExecutor);
        const notDrawn = !drawnTaskIds.includes(t.id);
        return locMatch && genderMatch && notDrawn;
      });

      if (availableTasks.length === 0) {
        alert("⚠️ 符合條件的任務已全部抽取完畢！（可點擊最下方按鈕重置紀錄）");
        return;
      }

      const randomIndex = Math.floor(Math.random() * availableTasks.length);
      currentDrawnTask = availableTasks[randomIndex];

      document.getElementById('result-tag').innerText = `${currentDrawnTask.location} · 輸家：${selectedExecutor}`;
      document.getElementById('result-content').innerText = currentDrawnTask.content;
      document.getElementById('result-box').classList.remove('hidden');
    }

    async function handleTaskAction(statusType) {
      if (!currentDrawnTask) return;

      const newLog = {
        log_id: Date.now().toString() + '_' + Math.random().toString(36).slice(2, 7),
        task_id: currentDrawnTask.id,
        executor: selectedExecutor,
        content: currentDrawnTask.content,
        status: statusType === '已完成' ? '已完成任務' : '稍後完成'
      };

      try {
        const { error } = await supabaseClient.from('drawn_logs').insert([newLog]);
        if (error) throw error;

        drawnLogs.unshift(newLog);
        document.getElementById('result-box').classList.add('hidden');
        currentDrawnTask = null;
        renderLogs();
      } catch (err) {
        console.error(err);
        alert('儲存紀錄失敗：' + (err.message || err));
      }
    }

    async function toggleLogStatus(logId) {
      const log = drawnLogs.find(l => l.log_id === logId);
      if (!log) return;

      const newStatus = log.status === '已完成任務' ? '稍後完成' : '已完成任務';

      try {
        const { error } = await supabaseClient
          .from('drawn_logs')
          .update({ status: newStatus })
          .eq('log_id', logId);
        if (error) throw error;

        log.status = newStatus;
        renderLogs();
      } catch (err) {
        console.error(err);
        alert('更新狀態失敗：' + (err.message || err));
      }
    }

    function renderLogs() {
      const maleBox = document.getElementById('log-list-male');
      const femaleBox = document.getElementById('log-list-female');

      const maleLogs = drawnLogs.filter(l => l.executor === '男');
      const femaleLogs = drawnLogs.filter(l => l.executor === '女');

      document.getElementById('male-count').innerText = maleLogs.length;
      document.getElementById('female-count').innerText = femaleLogs.length;

      maleBox.innerHTML = maleLogs.length ? maleLogs.map(l => createLogCardHtml(l)).join('') : '<p class="text-[11px] text-slate-500 text-center py-4">暫無紀錄</p>';
      femaleBox.innerHTML = femaleLogs.length ? femaleLogs.map(l => createLogCardHtml(l)).join('') : '<p class="text-[11px] text-slate-500 text-center py-4">暫無紀錄</p>';
    }

    function createLogCardHtml(log) {
      const isLater = log.status === '稍後完成';
      const statusClass = isLater ? 'text-red-400 border-red-800/80 bg-red-950/60 font-bold' : 'text-emerald-400 border-emerald-800/60 bg-emerald-950/40';

      return `
        <div onclick="toggleLogStatus('${log.log_id}')" class="p-2.5 rounded-xl bg-slate-950/80 border border-slate-800 cursor-pointer hover:border-slate-700 transition-all space-y-1.5">
          <p class="text-xs text-slate-200 leading-snug font-medium">${log.content}</p>
          <div class="flex justify-between items-center text-[9px]">
            <span class="px-1.5 py-0.5 rounded border ${statusClass}">
              ${log.status}
            </span>
            <span class="text-slate-500">點擊切換</span>
          </div>
        </div>
      `;
    }

    // ========== 重置紀錄 ==========
    async function confirmResetAll() {
      if (!confirm("確定要重置所有紀錄嗎？\n重置後記錄清單將會徹底清空，所有任務回復為可被抽籤狀態！")) return;

      try {
        // 刪除所有紀錄
        const { error } = await supabaseClient
          .from('drawn_logs')
          .delete()
          .neq('log_id', ''); // 刪除全部

        if (error) throw error;

        drawnLogs = [];
        currentDrawnTask = null;
        document.getElementById('result-box').classList.add('hidden');
        renderLogs();
        alert("✅ 紀錄已成功重置！所有懲罰項目現在都可以重新被抽籤。");
      } catch (err) {
        console.error(err);
        alert('重置失敗：' + (err.message || err));
      }
    }

    // ========== 後台密碼保護 ==========
    function tryOpenBackend() {
      if (isBackendUnlocked || sessionStorage.getItem('backend_unlocked') === 'true') {
        isBackendUnlocked = true;
        switchPage('backend');
        return;
      }

      const pwd = prompt('請輸入後台密碼：');
      if (pwd === BACKEND_PASSWORD) {
        isBackendUnlocked = true;
        sessionStorage.setItem('backend_unlocked', 'true');
        switchPage('backend');
      } else if (pwd !== null) {
        alert('密碼錯誤！');
      }
    }

    // ========== 視圖切換 ==========
    function switchPage(page) {
      const home = document.getElementById('home-page');
      const backend = document.getElementById('page-backend');
      const btnDraw = document.getElementById('nav-draw-btn');
      const btnBackend = document.getElementById('nav-backend-btn');

      if (page === 'draw') {
        home.classList.remove('hidden');
        backend.classList.add('hidden');
        btnDraw.className = "px-3 py-1.5 rounded-full transition-all flex items-center gap-1 bg-gradient-to-r from-rose-600 to-purple-600 text-white shadow-md";
        btnBackend.className = "px-3 py-1.5 rounded-full transition-all flex items-center gap-1 text-slate-400 hover:text-slate-200";
      } else {
        home.classList.add('hidden');
        backend.classList.remove('hidden');
        btnBackend.className = "px-3 py-1.5 rounded-full transition-all flex items-center gap-1 bg-gradient-to-r from-rose-600 to-purple-600 text-white shadow-md";
        btnDraw.className = "px-3 py-1.5 rounded-full transition-all flex items-center gap-1 text-slate-400 hover:text-slate-200";
        renderBackendList();
      }
    }

    // ========== 任務後台 CRUD ==========
    function renderBackendList() {
      const search = (document.getElementById('backend-search').value || '').toLowerCase();
      const listEl = document.getElementById('backend-task-list');

      const filtered = tasks.filter(t => t.content.toLowerCase().includes(search));
      document.getElementById('backend-count').innerText = tasks.length;

      if (filtered.length === 0) {
        listEl.innerHTML = '<p class="text-[11px] text-slate-500 text-center py-6">找不到符合的懲罰任務</p>';
        return;
      }

      listEl.innerHTML = filtered.map(t => `
        <div class="glass-card p-3 rounded-xl flex items-start justify-between gap-2 text-xs">
          <div class="flex-1 space-y-1">
            <div class="flex items-center gap-1.5 text-[9px]">
              <span class="px-1.5 py-0.5 bg-slate-950 rounded border border-slate-800 text-rose-300">${t.location}</span>
              <span class="px-1.5 py-0.5 bg-slate-950 rounded border border-slate-800 text-purple-300">性別：${t.gender}</span>
            </div>
            <div class="text-slate-200 font-medium leading-relaxed">${t.content}</div>
          </div>
          <div class="flex items-center gap-1">
            <button onclick="editTask('${t.id}')" class="text-slate-300 hover:text-rose-400 p-1.5 bg-slate-950 rounded-lg border border-slate-800 text-[10px]">
              ✏️ 編輯
            </button>
            <button onclick="deleteTask('${t.id}')" class="text-slate-300 hover:text-red-400 p-1.5 bg-slate-950 rounded-lg border border-slate-800 text-[10px]">
              🗑️
            </button>
          </div>
        </div>
      `).join('');
    }

    async function saveTask() {
      const editId = document.getElementById('edit-task-id').value;
      const loc = document.getElementById('input-task-loc').value;
      const gender = document.getElementById('input-task-gender').value;
      const content = document.getElementById('input-task-content').value.trim();

      if (!content) {
        alert("請輸入任務描述內容！");
        return;
      }

      try {
        if (editId) {
          // 更新
          const { error } = await supabaseClient
            .from('tasks')
            .update({ location: loc, gender: gender, content: content })
            .eq('id', editId);
          if (error) throw error;

          tasks = tasks.map(t => t.id === editId ? { ...t, location: loc, gender: gender, content: content } : t);

          // 同步更新已有紀錄的內容
          await supabaseClient
            .from('drawn_logs')
            .update({ content: content })
            .eq('task_id', editId);

          drawnLogs = drawnLogs.map(l => l.task_id === editId ? { ...l, content: content } : l);
        } else {
          // 新增
          const newTask = {
            id: 'custom_' + Date.now(),
            location: loc,
            gender: gender,
            content: content
          };
          const { error } = await supabaseClient.from('tasks').insert([newTask]);
          if (error) throw error;
          tasks.push(newTask);
        }

        cancelEdit();
        renderBackendList();
        renderLogs();
        alert(editId ? "✅ 任務編輯成功！" : "✅ 任務新增成功！");
      } catch (err) {
        console.error(err);
        alert('儲存失敗：' + (err.message || err));
      }
    }

    function editTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      document.getElementById('edit-task-id').value = task.id;
      document.getElementById('input-task-loc').value = task.location;
      document.getElementById('input-task-gender').value = task.gender;
      document.getElementById('input-task-content').value = task.content;

      document.getElementById('backend-form-title').innerText = "✏️ 編輯懲罰任務";
      document.getElementById('btn-save-task').innerText = "儲存修改內容";
      document.getElementById('btn-cancel-edit').classList.remove('hidden');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
      document.getElementById('edit-task-id').value = "";
      document.getElementById('input-task-content').value = "";
      document.getElementById('backend-form-title').innerText = "➕ 新增懲罰任務";
      document.getElementById('btn-save-task').innerText = "儲存任務";
      document.getElementById('btn-cancel-edit').classList.add('hidden');
    }

    async function deleteTask(id) {
      if (!confirm("確定要刪除這條懲罰任務嗎？")) return;

      try {
        const { error } = await supabaseClient.from('tasks').delete().eq('id', id);
        if (error) throw error;

        // 同時刪除相關紀錄
        await supabaseClient.from('drawn_logs').delete().eq('task_id', id);

        tasks = tasks.filter(t => t.id !== id);
        drawnLogs = drawnLogs.filter(l => l.task_id !== id);

        renderBackendList();
        renderLogs();
      } catch (err) {
        console.error(err);
        alert('刪除失敗：' + (err.message || err));
      }
    }
  </script>
</body>
</html>
